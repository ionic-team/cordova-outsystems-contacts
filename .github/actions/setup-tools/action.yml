name: 'Setup Tools'
description: 'Setup tools needed in repo'

runs:
  using: 'composite'
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies root
      shell: bash
      run: npm ci
    - name: Install dependencies plugin
      working-directory: ./packages/cordova-plugin
      shell: bash
      run: npm ci
